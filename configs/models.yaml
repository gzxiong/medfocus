# Six LVLMs evaluated in the paper. Add or override as needed.
# `family` controls which adapter is used (Qwen-VL or Gemma image-text formats).
# `image_token` is what the tokenizer uses for image patches; left empty values fall
# back to detection via tokenizer.image_token_id when loading.

models:
  qwen2_5_vl_3b:
    hf_id: Qwen/Qwen2.5-VL-3B-Instruct
    family: qwen
    dtype: bfloat16
    image_token: "<|image_pad|>"

  qwen2_5_vl_7b:
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    family: qwen
    dtype: bfloat16
    image_token: "<|image_pad|>"

  gemma3_4b:
    hf_id: google/gemma-3-4b-it
    family: gemma
    dtype: bfloat16
    image_token: "<image_soft_token>"

  gemma3_12b:
    hf_id: google/gemma-3-12b-it
    family: gemma
    dtype: bfloat16
    image_token: "<image_soft_token>"

  medgemma_4b:
    hf_id: google/medgemma-4b-it
    family: gemma
    dtype: bfloat16
    image_token: "<image_soft_token>"

  medgemma1_5_4b:
    hf_id: google/medgemma-1.5-4b-it
    family: gemma
    dtype: bfloat16
    image_token: "<image_soft_token>"
