[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medfocus"
version = "0.1.0"
description = "Concept-based causal attribution for chest X-ray reasoning in LVLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers==4.57.3",
    "accelerate>=1.0",
    "tokenizers>=0.22",
    "diffusers>=0.36",
    "huggingface_hub>=0.24",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydicom>=3.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "jupyter", "ipykernel"]

[project.scripts]
medfocus-attribute = "medfocus.cli.run_attribution:main"
medfocus-eval = "medfocus.cli.eval_attribution:main"

[tool.setuptools.packages.find]
include = ["medfocus*", "benchmark*"]

[tool.ruff]
line-length = 110
target-version = "py310"
